<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UWB Trilateration Map</title>
  <style>
    #mapCanvas { border:1px solid #000; }
  </style>
  <script>
    const canvasWidth  = 800;
    const canvasHeight = 500;
    const physicalW    = 11.55;
    const physicalH    = 5.85;
    const drawH        = 300;
    const ratio        = physicalW/physicalH;
    const drawW        = drawH*ratio;
    const mX           = (canvasWidth-drawW)/2;
    const mY           = (canvasHeight-drawH)/2;
    const scaleX       = drawW/physicalW;
    const scaleY       = drawH/physicalH;
    const r           = 5;
    const bgSrc        = "{{ url_for('static', filename='test-bed.jpg') }}";
    let bgImage = new Image();
    bgImage.src = bgSrc;

    function physicalToPixel(x,y){
      return {
        x: mX + x*scaleX,
        y: canvasHeight - mY - y*scaleY
      };
    }

    function updateMap(){
      fetch("/data")
      .then(r=>r.json())
      .then(d=>{
        const c = document.getElementById("mapCanvas");
        const ctx = c.getContext("2d");
        ctx.clearRect(0,0,canvasWidth,canvasHeight);
        ctx.drawImage(bgImage, mX, mY, drawW, drawH);

        // 앵커
        for(let [aid,pos] of Object.entries(d.anchor_positions)){
          let p = physicalToPixel(pos[0],pos[1]);
          ctx.beginPath();
          ctx.arc(p.x,p.y,r,0,2*Math.PI);
          ctx.fillStyle="orange"; ctx.fill();
          ctx.fillStyle="black";
          ctx.fillText(aid, p.x+ r+2, p.y - r-2);
        }

        // 태그
        if(d.tag){
          let tp = physicalToPixel(d.tag.x, d.tag.y);
          ctx.beginPath();
          ctx.arc(tp.x,tp.y,r,0,2*Math.PI);
          ctx.fillStyle="blue"; ctx.fill();
          ctx.fillStyle="black";
          ctx.fillText("TAG", tp.x+ r+2, tp.y - r-2);
        }
      })
      .catch(console.error);
    }

    document.addEventListener("DOMContentLoaded",()=>{
      bgImage.onload = ()=>{
        updateMap();
        setInterval(updateMap, 1000);
      };
    });
  </script>
</head>
<body>
  <h1>UWB Trilateration Map</h1>
  <canvas id="mapCanvas" width="800" height="500"></canvas>
</body>
</html>
